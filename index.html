    <!-- Google Analytics (GA4). Measurement ID dari VITE_GA_MEASUREMENT_ID (lihat .env.example)
         - send_page_view dimatikan karena pageview dikirim manual tiap ganti rute React Router,
         lihat src/lib/analytics.js - kalau tidak, pageview kedua tidak akan tercatat sebab
         GA hanya mendeteksi full page load, bukan navigasi client-side SPA. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
      // Google Ads conversion tag (Fase 1.A "Unified Conversion Tracking") - pakai gtag.js yang
      // sama dengan GA4 di atas (multi-tag, cukup satu script loader), tapi hanya di-config kalau
      // VITE_GOOGLE_ADS_CONVERSION_ID sudah diisi (lihat .env.example). Dua kondisi dicek: var
      // yang truthy (bukan '', belum diisi di .env) DAN tidak mengandung '%' (Vite tidak
      // mengganti %VAR% yang tidak terdefinisi sama sekali di .env, placeholder-nya tetap literal).
      var GOOGLE_ADS_ID = '%VITE_GOOGLE_ADS_CONVERSION_ID%';
      if (GOOGLE_ADS_ID && GOOGLE_ADS_ID.indexOf('%') === -1) {
        gtag('config', GOOGLE_ADS_ID);
      }
    </script>
    <!-- Meta (Facebook/Instagram) Pixel - Fase 1.A. Aktif hanya kalau VITE_META_PIXEL_ID sudah
         diisi (lihat .env.example, ID didapat dari Facebook Ads Manager > Events Manager). Base
         code standar Meta (tanpa noscript fallback - <noscript><img></noscript> di <head> tidak
         valid HTML5 dan bikin Vite gagal parse; JS-disabled browser sudah sangat jarang, dan
         GA4 di atas juga tidak punya fallback ini). -->
    <script>
      var META_PIXEL_ID = '%VITE_META_PIXEL_ID%';
      if (META_PIXEL_ID && META_PIXEL_ID.indexOf('%') === -1) {

        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?

        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', META_PIXEL_ID);
        fbq('track', 'PageView');
      }
    </script>
